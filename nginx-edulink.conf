# ── EduLink (app.inbilt.co + api.inbilt.co) ──────────────────────────────────
# Place in /etc/nginx/sites-available/edulink and symlink to sites-enabled.
# Then: sudo certbot --nginx -d app.inbilt.co -d api.inbilt.co -d inbilt.co

# Admin panel
server {
    listen 80;
    server_name app.inbilt.co;

    # API calls from the admin panel
    location /api/admin {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API (webhooks, health)
server {
    listen 80;
    server_name api.inbilt.co;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Bare domain redirect
server {
    listen 80;
    server_name inbilt.co;
    return 301 https://app.inbilt.co$request_uri;
}
