version: "3.9"

# ── Production overrides (AWS EC2 + nginx) ────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# nginx handles HTTPS termination + reverse proxy externally.

services:

  schoolbot:
    ports:
      - "127.0.0.1:8080:8000"   # only localhost — nginx proxies to here
    environment:
      - WAHA_URL=http://waha:3000

  admin-panel:
    ports:
      - "127.0.0.1:3001:3000"   # only localhost — nginx proxies to here

  waha:
    ports:
      - "127.0.0.1:3002:3000"   # only localhost — for QR scan via SSH tunnel
    environment:
      - WHATSAPP_HOOK_URL=http://schoolbot:8000/webhook/whatsapp

  postgres:
    ports: []                    # no external access
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schoolbot}

  caddy:
    profiles:
      - never                    # disabled — using nginx instead

  pgadmin:
    profiles:
      - never
